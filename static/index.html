<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#071521" />
    <meta name="description" content="某角色的身份推理——《魔法禁书目录》非官方角色猜测游戏静态版。" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%toaru-character-title.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <script>
      try {
        var storedUiTheme = localStorage.getItem('ui-theme');
        if (localStorage.getItem('ui-motion') === 'off') document.documentElement.dataset.motion = 'reduced';
        var initTheme = storedUiTheme === 'light' ? 'light' : storedUiTheme === 'blast' ? 'blast' : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'blast';
        document.documentElement.dataset.theme = initTheme;
        document.documentElement.style.colorScheme = initTheme === 'blast' ? 'dark' : 'light';
        document.documentElement.style.background = initTheme === 'blast' ? '#071521' : '#edf7ff';
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) themeColorMeta.content = initTheme === 'blast' ? '#071521' : '#edf7ff';
      } catch (_) {
        document.documentElement.dataset.theme = 'blast';
        document.documentElement.style.background = '#071521';
      }
    </script>
    <title>某角色的身份推理 · 静态版</title>
  </head>
  <body>
    <noscript>需要启用 JavaScript 才能运行本应用。/ JavaScript is required to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
